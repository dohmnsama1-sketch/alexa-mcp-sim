[project]
name = "alexa-mcp-sim"
version = "0.1.0"
description = "Open-source Echo Show-style voice simulator for any Streamable HTTP MCP server: speech in/out, speaker profiles, MCP Apps cards, JSON-RPC trace, offline or Amazon Bedrock planner."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "uvicorn>=0.30", "starlette>=0.37"]

[project.optional-dependencies]
bedrock = ["boto3>=1.35"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
alexa-mcp-sim = "alexa_mcp_sim.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alexa_mcp_sim = ["static/*.html"]
